---
# worker-join.yaml
# 대상: workers 그룹 전체
# 목적: control plane에서 join 커맨드를 동적으로 가져와 worker 노드를 클러스터에 합류시킴

# -------------------------------------------------------
# Phase 1: control plane에서 join 커맨드 생성
# -------------------------------------------------------
- name: (Demo) Generate kubeadm join command on control plane
  hosts: control_plane
  become: true

  tasks:
    - name: Create new bootstrap token and get join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Expose join command as fact
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"

# -------------------------------------------------------
# Phase 2: 각 worker에서 kubeadm join 실행
# -------------------------------------------------------
- name: Join worker nodes to cluster
  hosts: workers
  become: true

  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Run kubeadm join
      shell: "{{ hostvars[groups['control_plane'][0]]['join_command'] }}"
      when: not kubelet_conf.stat.exists
      register: join_result

    - name: Show join result
      debug:
        msg: "{{ join_result.stdout_lines }}"
      when: join_result is not skipped
