---
# node-prerequisites.yaml
# 대상: workers 그룹 전체
# 목적: containerd 설치 및 설정, kubeadm/kubelet/kubectl 설치

- name: (Demo) Common provisioning for all k8s nodes
  hosts: k8s_cluster
  become: true # sudo, su 등 권한 상승 필요 작업이 많으므로 playbook 전체에 적용

  vars:
    k8s_version: "1.35"
    containerd_version: "2.2.2-1~ubuntu.24.04~noble"

  tasks:

    # -------------------------------------------------------
    # 1. swap off
    # -------------------------------------------------------
    - name: Disable swap (runtime)
      command: swapoff -a
      changed_when: false

    - name: Disable swap (persistent)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    # -------------------------------------------------------
    # 2. 커널 모듈 로드 및 IPv4 packet forwarding
    # -------------------------------------------------------
    - name: Load required kernel modules (persistent)
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay

    - name: Load overlay module
      modprobe:
        name: overlay
        state: present

    - name: Set sysctl params for k8s
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: "net.ipv4.ip_forward",          value: "1" }

    # -------------------------------------------------------
    # 3. containerd 설치 (Docker 이용)
    # -------------------------------------------------------

    - name: Uninstall old versions of Docker and containerd
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
        state: absent
        purge: true
    
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create /etc/apt/keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install containerd.io
      apt:
        name: "containerd.io={{ containerd_version }}"
        state: present
        update_cache: true

    - name: Hold containerd.io at current version
      dpkg_selections:
        name: containerd.io
        selection: hold

    # -------------------------------------------------------
    # 4. containerd SystemdCgroup = true 설정
    # -------------------------------------------------------
    - name: Write default containerd config
      shell: containerd config default | tee /etc/containerd/config.toml > /dev/null

    - name: Set SystemdCgroup = true
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable containerd
      systemd:
        name: containerd
        enabled: true
        daemon_reload: true

    - name: Verify SystemdCgroup is set
      shell: containerd config dump | grep SystemdCgroup
      register: cgroup_check
      changed_when: false

    - name: Assert SystemdCgroup = true
      assert:
        that: "'SystemdCgroup = true' in cgroup_check.stdout"
        fail_msg: "SystemdCgroup가 true로 설정되지 않았습니다"

    # -------------------------------------------------------
    # 5. kubeadm, kubelet, kubectl 설치 (pkgs.k8s.io)
    # -------------------------------------------------------
    - name: Install apt-transport-https and gpg
      apt:
        name:
          - apt-transport-https
          - gpg
        state: present

    - name: Download Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold kubeadm, kubelet, kubectl at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
