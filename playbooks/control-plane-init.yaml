---
# control-plane-init.yaml
# 대상: control_plane
# 목적: kubeadm init, kubeconfig 설정, Calico CNI 설치
# 전제조건: node-prerequisites 실행 완료
# 참고: hands-on Creating a cluster with kubeadm 문서 기반

- name: (Demo) Initialize Kubernetes control plane
  hosts: control_plane
  become: true

  vars:
    pod_network_cidr: "10.245.0.0/16"
    calico_version: "v3.31.4"
    calico_base_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests"
    # control plane을 실행하는 non-root 유저 (kubeconfig 소유자)
    k8s_user: "ubuntu"
    k8s_user_home: "/home/ubuntu"

  tasks:

    # -------------------------------------------------------
    # 1. kubeadm init
    # -------------------------------------------------------
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Run kubeadm init
      shell: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
      when: not admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Show kubeadm init output
      debug:
        msg: "{{ kubeadm_init_result.stdout_lines }}"
      when: kubeadm_init_result is not skipped

    # -------------------------------------------------------
    # 2. kubeconfig 설정 (non-root user)
    # -------------------------------------------------------
    - name: Create .kube directory for {{ k8s_user }}
      file:
        path: "{{ k8s_user_home }}/.kube"
        state: directory
        owner: "{{ k8s_user }}"
        group: "{{ k8s_user }}"
        mode: "0755"

    - name: Copy admin.conf to user kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ k8s_user_home }}/.kube/config"
        remote_src: true
        owner: "{{ k8s_user }}"
        group: "{{ k8s_user }}"
        mode: "0600"

    # -------------------------------------------------------
    # 3. Calico CNI 설치
    # 참고: https://docs.tigera.io/calico/latest/getting-started/kubernetes/self-managed-onprem/onpremises
    # -------------------------------------------------------

    # kubectl 명령은 non-root user로 실행 (kubeconfig가 ubuntu 홈에 있으므로)
    - name: Install Calico operator CRDs
      shell: >
        kubectl create -f {{ calico_base_url }}/operator-crds.yaml
        --kubeconfig={{ k8s_user_home }}/.kube/config
      become_user: "{{ k8s_user }}"
      register: crds_result
      # 이미 존재하면 AlreadyExists 에러 → 무시
      failed_when:
        - crds_result.rc != 0
        - "'AlreadyExists' not in crds_result.stderr"
      changed_when: crds_result.rc == 0

    - name: Install Tigera operator
      shell: >
        kubectl create -f {{ calico_base_url }}/tigera-operator.yaml
        --kubeconfig={{ k8s_user_home }}/.kube/config
      become_user: "{{ k8s_user }}"
      register: operator_result
      failed_when:
        - operator_result.rc != 0
        - "'AlreadyExists' not in operator_result.stderr"
      changed_when: operator_result.rc == 0

    - name: Download Calico custom-resources.yaml
      get_url:
        url: "{{ calico_base_url }}/custom-resources.yaml"
        dest: /tmp/custom-resources.yaml
        mode: "0644"
        force: true

    - name: Patch pod CIDR in custom-resources.yaml
      replace:
        path: /tmp/custom-resources.yaml
        regexp: 'cidr: .*'
        replace: "cidr: {{ pod_network_cidr }}"

    - name: Apply Calico custom resources
      shell: >
        kubectl create -f /tmp/custom-resources.yaml
        --kubeconfig={{ k8s_user_home }}/.kube/config
      become_user: "{{ k8s_user }}"
      register: calico_cr_result
      failed_when:
        - calico_cr_result.rc != 0
        - "'AlreadyExists' not in calico_cr_result.stderr"
      changed_when: calico_cr_result.rc == 0

    # -------------------------------------------------------
    # 4. CoreDNS가 Running 상태가 될 때까지 대기
    # kubeadm 공식 문서: CoreDNS가 Running이어야 worker join 가능
    # -------------------------------------------------------
    - name: Wait for CoreDNS pods to be Running
      shell: >
        kubectl get pods -n kube-system -l k8s-app=kube-dns
        --kubeconfig={{ k8s_user_home }}/.kube/config
        --no-headers
      become_user: "{{ k8s_user }}"
      register: coredns_status
      until: >
        coredns_status.stdout_lines | length > 0
        and coredns_status.stdout_lines | select('search', 'Running') | list | length
        == coredns_status.stdout_lines | length
      retries: 20
      delay: 15
      changed_when: false

    - name: Show final cluster pod status
      shell: >
        kubectl get pods --all-namespaces
        --kubeconfig={{ k8s_user_home }}/.kube/config
      become_user: "{{ k8s_user }}"
      register: all_pods
      changed_when: false

    - name: Display all pods
      debug:
        msg: "{{ all_pods.stdout_lines }}"
